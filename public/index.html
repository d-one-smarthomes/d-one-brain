<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0d1621" />
<title>D-One · Central Brain</title>
<style>
  :root{
    --blue:#1379C9; --blue-dim:#1f5f96; --blue-soft:rgba(19,121,201,.14);
    --bg:#0b131d; --bg2:#0f1a26; --panel:#131f2d; --panel2:#172536;
    --line:#213348; --line-soft:#1a2836;
    --ink:#eaf1f8; --ink2:#a9bacb; --ink3:#6f8296;
    --good:#3fbf8f; --warn:#e0a53d; --recede:#8194a7; --danger:#e05555;
    --radius:16px; --shadow:0 1px 0 rgba(255,255,255,.03), 0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 50% -10%, #12263a 0%, var(--bg) 55%) fixed;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5; letter-spacing:.1px; padding:0 0 96px;
  }
  a{color:var(--blue)}
  .wrap{max-width:960px;margin:0 auto;padding:0 16px}

  header{position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg, rgba(11,19,29,.96), rgba(11,19,29,.86));
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft)}
  .hrow{display:flex;align-items:center;gap:12px;padding:14px 16px;max-width:960px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px var(--blue-soft);flex:none}
  .brand h1{font-size:16px;font-weight:700;margin:0;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .spacer{flex:1}
  .ctl{display:flex;align-items:center;gap:8px}
  .btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);
    font-size:13px;font-weight:600;padding:8px 12px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .btn:active{transform:translateY(1px)}
  .btn.icon{padding:8px 10px}
  .toggle{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);user-select:none;cursor:pointer}
  .switch{width:34px;height:20px;border-radius:20px;background:var(--line);position:relative;transition:.2s;flex:none}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
  .switch.on{background:var(--blue)} .switch.on::after{left:16px}
  .updated{font-size:11px;color:var(--ink3);padding:0 16px 10px;max-width:960px;margin:0 auto;display:flex;gap:8px;align-items:center}
  .spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--blue);animation:sp .7s linear infinite;display:none}
  .spin.show{display:inline-block}
  @keyframes sp{to{transform:rotate(360deg)}}

  section{margin:26px 0}
  .sec-head{display:flex;align-items:center;gap:10px;margin:0 0 12px;padding:0 2px}
  .sec-head .k{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--blue);text-transform:uppercase}
  .sec-head .l{width:26px;height:2px;background:var(--blue);border-radius:2px;opacity:.5}
  .sec-head h2{font-size:19px;font-weight:700;margin:0}
  .muted{color:var(--ink3);font-size:13px;margin:0 2px 14px}
  .panel{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line-soft);border-radius:var(--radius);box-shadow:var(--shadow)}
  .pad{padding:16px 18px}

  /* editable + controls */
  .edit{cursor:text;border-radius:5px;padding:0 3px;transition:background .12s;min-width:8px;display:inline-block}
  .edit:empty:before{content:attr(data-ph);color:var(--ink3);opacity:.7}
  .edit:hover{background:rgba(255,255,255,.05)}
  .edit:focus{background:rgba(19,121,201,.16);outline:none;box-shadow:inset 0 0 0 1px var(--blue-dim)}
  .tick{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);background:transparent;cursor:pointer;flex:none;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800;padding:0}
  .tick.on{background:var(--good);border-color:var(--good)}
  .del{border:none;background:transparent;color:var(--ink3);cursor:pointer;font-size:17px;line-height:1;padding:2px 7px;border-radius:6px;flex:none}
  .del:hover{color:#fff;background:rgba(224,85,85,.28)}
  .del.txt{font-size:12px;font-weight:600;padding:3px 9px}
  .add{display:inline-flex;align-items:center;gap:6px;margin-top:9px;border:1px dashed var(--line);background:transparent;color:var(--ink3);border-radius:10px;padding:6px 12px;font-size:12.5px;cursor:pointer}
  .add:hover{color:var(--blue);border-color:var(--blue-dim)}
  .irow{display:flex;align-items:center;gap:9px;padding:4px 0}
  .irow .edit{flex:1;font-size:13.5px;color:var(--ink2)}
  .isdone > .edit,.isdone .rtext{text-decoration:line-through;color:var(--ink3)!important}

  .three{display:grid;grid-template-columns:1fr;gap:14px}
  .fcard{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);
    border-left:3px solid var(--blue);border-radius:var(--radius);padding:18px 18px 14px;position:relative;overflow:hidden}
  .fcard .n{position:absolute;top:8px;right:14px;font-size:40px;font-weight:800;color:var(--blue-soft);line-height:1}
  .fcard h3{margin:0 44px 8px 0;font-size:17px;font-weight:700}
  .fcard .rtext.det{color:var(--ink2);font-size:14px;display:block;margin-bottom:10px}
  .cardfoot{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line-soft);padding-top:10px;margin-top:2px}
  .cardfoot .lbl{font-size:12px;color:var(--ink3)}
  .isdone.fcard h3 .rtext{text-decoration:line-through;color:var(--ink3)}

  .strip{margin-top:16px}
  .strip .lab{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--recede);margin:0 0 8px}
  .watch{display:flex;flex-direction:column;gap:8px}
  .witem{background:var(--panel);border:1px solid var(--line-soft);border-radius:12px;padding:11px 13px;display:flex;gap:10px;align-items:flex-start}
  .witem .body{flex:1;min-width:0}
  .witem .t{font-weight:650;font-size:14px}
  .witem .d{color:var(--ink3);font-size:12.5px;margin-top:3px}
  .owner-row{margin-top:7px;font-size:11px}
  .owner-row .edit{color:var(--blue);background:var(--blue-soft);border-radius:999px;padding:2px 9px;font-weight:700}

  details.filter{border:1px solid var(--line-soft);border-radius:var(--radius);background:linear-gradient(180deg,var(--panel),var(--bg2));overflow:hidden}
  details.filter>summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;gap:12px}
  details.filter>summary::-webkit-details-marker{display:none}
  details.filter>summary .ttl{font-weight:700;font-size:16px}
  details.filter>summary .hint{color:var(--ink3);font-size:12px}
  details.filter>summary .chev{margin-left:auto;transition:.2s;color:var(--ink3)}
  details.filter[open]>summary .chev{transform:rotate(180deg)}
  .filter .body{padding:2px 18px 18px}
  .filter .intro{color:var(--ink2);font-size:13.5px;margin:0 0 12px}
  .qlist{display:flex;flex-direction:column;gap:10px;margin:0 0 16px;padding:0;list-style:none}
  .qrow{position:relative;padding:12px 40px 12px 14px;background:var(--panel);border:1px solid var(--line-soft);border-radius:12px;font-size:14px;color:var(--ink)}
  .qrow .del{position:absolute;right:6px;top:9px}
  .mottos{display:grid;grid-template-columns:1fr;gap:10px}
  .motto{border-left:3px solid var(--blue);padding:8px 0 8px 14px}
  .motto .m{font-size:15px;font-weight:650;font-style:italic}
  .motto .cap{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--recede);font-weight:800}

  .areas{display:grid;grid-template-columns:1fr;gap:14px}
  .area .pad{padding:16px 18px 18px}
  .area .top{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
  .area .badge{font-size:12px;font-weight:800;color:var(--blue);background:var(--blue-soft);border-radius:8px;padding:2px 8px;flex:none}
  .area h3{margin:0;font-size:16px;font-weight:700}
  .area .stitle{color:var(--ink3);font-size:12.5px;margin:0 0 12px}
  .grp{margin-top:12px}
  .grp .lab{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;margin:0 0 5px;display:flex;align-items:center;gap:7px}
  .grp.now .lab{color:var(--blue)} .grp.del2 .lab{color:var(--good)} .grp.park .lab{color:var(--recede)} .grp.extra .lab{color:var(--ink2)}
  .empty{color:var(--ink3);font-size:12.5px;font-style:italic}

  .table{width:100%;border-collapse:collapse;font-size:13.5px}
  .trow{display:flex;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line-soft)}
  .trow:last-child{border-bottom:none}
  .trow .who{font-weight:700;color:var(--ink);flex:none;width:34%;max-width:130px}
  .trow .owns{color:var(--ink2);flex:1}

  .cols{display:grid;grid-template-columns:1fr;gap:14px}
  .col .lab{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink2);margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .col .count{font-size:11px;color:var(--ink3);background:var(--panel);border:1px solid var(--line-soft);border-radius:999px;padding:1px 8px}
  .task{background:var(--panel);border:1px solid var(--line-soft);border-radius:12px;padding:11px 12px;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start}
  .task .body{flex:1;min-width:0}
  .task .t{font-weight:650;font-size:14px}
  .task .c{color:var(--ink3);font-size:12.5px;margin-top:4px}
  .task .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:9px}
  .chip{font-size:11px;font-weight:700;background:var(--blue-soft);color:var(--blue);border-radius:999px;padding:2px 9px}
  .chip.time{background:transparent;border:1px solid var(--line);color:var(--ink3);font-weight:600}
  .chip.time .edit{color:var(--ink2)}
  .task.isdone .t .rtext{text-decoration:line-through;color:var(--ink3)}

  .goal .name{font-size:20px;font-weight:800;margin:0}
  .goal .tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--blue);margin-bottom:4px}
  .goal .stmt{color:var(--ink2);font-size:14px;margin:8px 0 16px}
  .checks{display:flex;flex-direction:column;gap:10px;margin:0 0 14px;padding:0;list-style:none}
  .crow{display:flex;gap:11px;align-items:flex-start;font-size:14px;color:var(--ink)}
  .crow .edit{flex:1}
  .crow.isdone .edit{text-decoration:line-through;color:var(--ink3)}
  .success{background:var(--blue-soft);border:1px solid var(--blue-dim);border-radius:12px;padding:13px 15px;font-size:13.5px;color:var(--ink)}
  .success b{color:var(--blue)}

  .flow{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;-webkit-overflow-scrolling:touch;flex-wrap:wrap}
  .stage{flex:none;display:flex;align-items:center;gap:6px}
  .stage .box2{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:12.5px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px}
  .stage .box2 .num{color:var(--blue);font-weight:800;font-size:11px}
  .stage .del{font-size:13px;padding:0 4px}

  .park-list{display:flex;flex-direction:column;gap:6px}

  .banner{border-radius:12px;padding:12px 15px;font-size:13px;margin:16px 0;display:none}
  .banner.info{background:var(--blue-soft);border:1px solid var(--blue-dim);color:var(--ink2)}
  .banner.show{display:block}
  footer{text-align:center;color:var(--ink3);font-size:11px;margin-top:40px}

  .savebar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:12px;align-items:center;justify-content:center;
    padding:12px 16px;background:linear-gradient(0deg,rgba(11,19,29,.99),rgba(11,19,29,.9));border-top:1px solid var(--line-soft);
    transform:translateY(130%);transition:transform .22s}
  .savebar.show{transform:none}
  .savebar .msg{font-size:13px;color:var(--ink2)}
  .savebar .save{background:var(--blue);border:none;color:#fff;font-weight:700;padding:10px 20px;border-radius:10px;cursor:pointer;font-size:14px}
  .savebar .save:disabled{opacity:.55}
  .toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:10px 16px;border-radius:10px;font-size:13px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
  .toast.show{opacity:1}
  .toast.err{border-color:var(--danger);color:#f3c0c0}

  @media(min-width:680px){
    .three{grid-template-columns:repeat(3,1fr)}
    .areas{grid-template-columns:1fr 1fr}
    .cols{grid-template-columns:1fr 1fr}
    .mottos{grid-template-columns:1fr 1fr}
  }

  /* ---- category boards (collapsible) ---- */
  .boardnav{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 6px}
  .boardnav .bn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink2);
    font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;cursor:pointer}
  .boardnav .bn:active{transform:translateY(1px)}
  .boardnav .bn.today{border-color:var(--blue);color:var(--blue);font-weight:800}
  .boardnav .bn.today.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  .boardnav .bn .tnum{display:inline-block;min-width:16px;padding:0 5px;margin-left:5px;border-radius:9px;background:rgba(19,121,201,.15);font-size:11px;font-weight:800;text-align:center}
  .boardnav .bn.today.on .tnum{background:rgba(255,255,255,.28);color:#fff}
  .board{border:1px solid var(--line-soft);border-radius:var(--radius);
    background:linear-gradient(180deg,var(--panel),var(--bg2));box-shadow:var(--shadow);margin:14px 0;overflow:hidden}
  .board>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:11px;padding:15px 16px;user-select:none}
  .board>summary::-webkit-details-marker{display:none}
  .board>summary .bicon{font-size:18px;flex:none;width:24px;text-align:center}
  .board>summary .btitle{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
  .board>summary .bsub{color:var(--ink3);font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .board>summary .bcount{margin-left:auto;font-size:11px;font-weight:800;color:var(--blue);background:var(--blue-soft);border-radius:999px;padding:2px 10px;flex:none}
  .board>summary .bchev{color:var(--ink3);transition:.2s;flex:none;font-size:12px}
  .board[open]>summary .bchev{transform:rotate(180deg)}
  .board[open]>summary{border-bottom:1px solid var(--line-soft)}
  .board.pin{border-left:3px solid var(--blue)}
  .bbody{padding:8px 16px 18px}
  .subgrid{display:grid;grid-template-columns:1fr;gap:0}
  .subarea{padding:15px 0;border-bottom:1px solid var(--line-soft)}
  .subarea:last-child{border-bottom:none}
  .subtop{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .subtop .badge{font-size:12px;font-weight:800;color:var(--blue);background:var(--blue-soft);border-radius:8px;padding:2px 8px;flex:none}
  .subtop h3{margin:0;font-size:15.5px;font-weight:700}
  .bbody .grp{margin-top:14px}
  .bbody .grp:first-child{margin-top:6px}
  .bbody .teamtbl{margin-top:2px}
  .bbody .goal .name{font-size:18px}
  .dedupe{color:var(--ink3);font-size:12px;font-style:italic;margin:10px 2px 0}
  .grp.tsk .task{margin-bottom:9px}
  @media(min-width:680px){
    .subgrid.two{grid-template-columns:1fr 1fr;gap:16px}
    .subgrid.two .subarea{border-bottom:1px solid var(--line-soft)}
  }
  /* ===== Daily check-in ===== */
  .checkin{background:linear-gradient(165deg,var(--panel2),var(--panel));border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 16px 14px;margin-bottom:14px;position:relative;overflow:hidden}
  .checkin::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--blue),var(--good))}
  .cihead{display:flex;align-items:flex-start;gap:14px;justify-content:space-between}
  .cikick{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);font-weight:800}
  .cidate{margin:2px 0 2px;font-size:19px;color:var(--ink);font-weight:800}
  .ciintro{margin:0;font-size:12.5px;color:var(--ink3)}
  .streak{flex:none;text-align:center;background:var(--blue-soft);border:1px solid var(--line);border-radius:14px;
    padding:8px 12px;min-width:74px;display:flex;flex-direction:column;align-items:center;line-height:1}
  .streak .sn{font-size:26px;font-weight:900;color:var(--good)}
  .streak .sl{font-size:10px;color:var(--ink2);margin-top:3px}
  .streak.off .sn{color:var(--ink3)}
  .prio{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:9px;margin:13px 0 4px}
  .pcard{background:var(--bg2);border:1px solid var(--line-soft);border-radius:12px;padding:9px 11px;display:flex;flex-direction:column;gap:3px;min-width:0}
  .pcard .pk{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700}
  .pcard .pv{font-size:13px;color:var(--ink2);font-weight:600;overflow:hidden;text-overflow:ellipsis}
  .pcard .pfrom{font-size:9.5px;color:var(--ink3);opacity:.7}
  .pcard.day{background:linear-gradient(150deg,rgba(19,121,201,.16),var(--bg2));border-color:var(--blue-dim)}
  .pcard.day .edit{font-size:15px;color:var(--ink);font-weight:700;min-height:20px}
  .pcard.day .pk{color:var(--blue)}
  .cigrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .cislot{background:var(--bg2);border:1px solid var(--line-soft);border-radius:12px;padding:11px 12px}
  .cislot.ok{border-color:var(--good);background:linear-gradient(160deg,rgba(63,191,143,.09),var(--bg2))}
  .cislot-h{display:flex;align-items:center;gap:10px}
  .bigtick{width:34px;height:34px;flex:none;border-radius:9px;border:2px solid var(--line);background:transparent;
    color:#fff;font-size:18px;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:.12s}
  .bigtick.on{background:var(--good);border-color:var(--good)}
  .bigtick:hover{border-color:var(--good)}
  .cit{display:flex;flex-direction:column;line-height:1.25}
  .cit b{font-size:14px;color:var(--ink)}
  .cistat{font-size:11.5px;color:var(--ink3)}
  .cistat.good{color:var(--good);font-weight:700}
  .cifield{margin-top:9px;display:flex;flex-direction:column;gap:2px}
  .cflab{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);font-weight:700}
  .cifield .edit{font-size:13px;color:var(--ink2);min-height:18px;background:var(--panel);border:1px solid var(--line-soft);border-radius:7px;padding:5px 8px}
  .energy{margin-top:10px}
  .edots{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
  .eball{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink3);
    font-size:11px;font-weight:700;cursor:pointer;transition:.1s}
  .eball:hover{border-color:var(--blue)}
  .eball.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .chase{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--ink2)}
  .cihist{margin-top:13px;padding-top:11px;border-top:1px solid var(--line-soft);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .chlab{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700}
  .cidays{display:flex;gap:7px}
  .cid{display:flex;flex-direction:column;align-items:center;gap:4px}
  .cid.now .cidlab{color:var(--blue);font-weight:800}
  .cidlab{font-size:9.5px;color:var(--ink3)}
  .cidpair{display:flex;gap:3px}
  .cdot{width:8px;height:8px;border-radius:50%;background:transparent;border:1.5px solid var(--line);display:inline-block}
  .cdot.on{background:var(--good);border-color:var(--good)}
  .chkey{font-size:10px;color:var(--ink3);display:inline-flex;align-items:center;gap:4px;margin-left:auto}
  .chkey .cdot{width:7px;height:7px}
  @media(max-width:640px){

    d.tasks[col] = arr(d.tasks[col]).map(t=>{
      t = Object.assign({title:'',context:'',tags:[],flag:false,due:null,odoo:null,done:(col==='done')}, t, {tags:arr(t&&t.tags)});
      if(t.tags.includes('Odoo')) t.odoo = Object.assign({dest:'Project',project:'',assignee:'',stage:'',deadline:'',status:'pending',odooId:null,pushedAt:''}, t.odoo||{});
      return t;
    });
  });
  d.parkingLot = arr(d.parkingLot).map(toItem);
  d.energyLog = arr(d.energyLog);
  d.dailyCheckin = ensureCheckin(d.dailyCheckin, d);
  return d;
}

// keep the check-in pinned to *today*: archive the outgoing day, reset for the new one,
// and mirror week/month priority from the single sources of truth.
function ensureCheckin(dc, d){
  dc = dc || {};
  dc.intro = dc.intro || "Check in before the day starts. Debrief when it ends. My promise to myself.";
  dc.priorities = Object.assign({day:'',week:'',month:''}, dc.priorities);
  dc.morning = Object.assign({done:false,at:'',intention:''}, dc.morning);
  dc.evening = Object.assign({done:false,at:'',energy:null,chaseMode:false,reflection:''}, dc.evening);
  dc.practice = Object.assign({move:false,silence:false,gratitude:false,listen:false}, dc.practice);
  dc.history = arr(dc.history);
  const today = todayISO();
  if(!dc.date) dc.date = today;
  if(dc.date !== today){
    const prev = dc.date;
    const pdid = dc.practice && (dc.practice.move||dc.practice.silence||dc.practice.gratitude||dc.practice.listen);
    const had = dc.morning.done||dc.evening.done||dc.priorities.day||dc.morning.intention||dc.evening.reflection||dc.evening.energy!=null||pdid;
    if(had && !dc.history.some(r=>r&&r.date===prev)){
      dc.history.push({ date:prev, morning:!!dc.morning.done, evening:!!dc.evening.done,
        dayPriority:dc.priorities.day||'', intention:dc.morning.intention||'',
        energy:(dc.evening.energy==null?null:dc.evening.energy), chaseMode:!!dc.evening.chaseMode,
        reflection:dc.evening.reflection||'',
        practice:{move:!!(dc.practice&&dc.practice.move),silence:!!(dc.practice&&dc.practice.silence),gratitude:!!(dc.practice&&dc.practice.gratitude),listen:!!(dc.practice&&dc.practice.listen)} });
    }
    dc.history = dc.history.slice(-90);
    dc.date = today;
    dc.morning = {done:false,at:'',intention:''};
    dc.evening = {done:false,at:'',energy:null,chaseMode:false,reflection:''};
    dc.practice = {move:false,silence:false,gratitude:false,listen:false};
    dc.priorities.day = '';
  }
  dc.priorities.week  = (d.weeklyFocus && d.weeklyFocus.three && d.weeklyFocus.three[0] && d.weeklyFocus.three[0].title) || dc.priorities.week || '';
  dc.priorities.month = (d.monthlyGoal && d.monthlyGoal.title) || dc.priorities.month || '';
  return dc;
}

// consecutive complete days (morning AND evening), ending today or (if today unfinished) yesterday
function checkinStreak(){
  const dc=ci(); const map={};
  arr(dc.history).forEach(r=>{ if(r&&r.date) map[r.date]={m:!!r.morning,e:!!r.evening}; });
  map[dc.date]={m:!!(dc.morning&&dc.morning.done), e:!!(dc.evening&&dc.evening.done)};
  const complete=d=> map[d] && map[d].m && map[d].e;
  const dayISO=off=>{ const t=new Date(); t.setDate(t.getDate()-off); return t.toISOString().slice(0,10); };
  let streak=0, start=0;
  if(!complete(dayISO(0))) start=1;   // an in-progress today shouldn't break the streak
  for(let k=start;k<400;k++){ if(complete(dayISO(k))) streak++; else break; }
  return streak;
}
function historyDots(){
  const dc=ci(); const map={};
  arr(dc.history).forEach(r=>{ if(r&&r.date) map[r.date]={m:!!r.morning,e:!!r.evening}; });
  map[dc.date]={m:!!(dc.morning&&dc.morning.done), e:!!(dc.evening&&dc.evening.done)};
  const dayISO=off=>{ const t=new Date(); t.setDate(t.getDate()-off); return t.toISOString().slice(0,10); };
  const lab=off=>{ const t=new Date(); t.setDate(t.getDate()-off); return t.toLocaleDateString(undefined,{weekday:'short'}); };
  let cells='';
  for(let k=6;k>=0;k--){ const iso=dayISO(k); const s=map[iso]||{m:false,e:false}; const now=k===0;
    cells+=`<div class="cid${now?' now':''}"><span class="cidlab">${now?'Today':esc(lab(k))}</span>`

  return cells;
}

// ===== Odoo two-way sync (live via odoo-list / odoo-update) =====
let ODOO={loaded:false,loading:false,tasks:[],err:null};
function odooDate(s){ if(!s) return null; const iso=String(s).replace(' ','T')+(/[zZ]|[+-]\d\d:?\d\d$/.test(String(s))?'':'Z'); const d=new Date(iso); return isNaN(d.getTime())?null:d; }
function odooInputVal(d){ if(!d) return ''; const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),a=String(d.getDate()).padStart(2,'0'); return y+'-'+m+'-'+a; }
async function loadOdoo(force){
  if(ODOO.loading) return; if(ODOO.loaded && !force) return;
  ODOO.loading=true; if(force) render();
  try{
    const res=await fetch('/.netlify/functions/odoo-list',{cache:'no-store', headers: pwHeaders()});
    const j=await res.json().catch(()=>({}));
    if(res.status===401){ ODOO.err='Locked — unlock the brain first'; }
    else if(!res.ok||!j.ok){ ODOO.err=(j&&j.error)||('HTTP '+res.status); }
    else { ODOO.tasks=j.tasks||[]; ODOO.err=null; }
    ODOO.loaded=true;
  }catch(e){ ODOO.err=String((e&&e.message)||e); ODOO.loaded=true; }
  finally{ ODOO.loading=false; render(); }
}
async function odooUpdate(id, patch){
  const body=Object.assign({password:getPw()||undefined, id:id}, patch);
  const res=await fetch('/.netlify/functions/odoo-update',{method:'POST', headers:Object.assign({'Content-Type':'application/json'}, pwHeaders()), body:JSON.stringify(body)});
  if(res.status===401){ if(promptUnlock()) return odooUpdate(id,patch); throw new Error('Locked'); }
  const j=await res.json().catch(()=>({}));
  if(!res.ok||!j.ok) throw new Error((j&&j.error)||('HTTP '+res.status));
  return j;
}
function odooRow(t){
  const d=odooDate(t.deadline); const val=odooInputVal(d);
  const label=d? d.toLocaleDateString(undefined,{day:'numeric',month:'short'}) : 'set due date';
  const over=val && val<todayISO();
  const proj=t.project?'<span class="chip oproj">'+esc(t.project)+'</span>':'';
  const flag=(t.priority&&t.priority!=='0')?'★ ':'';
  return '<div class="otask" data-oid="'+t.id+'">'
    +'<button class="otick" data-odone="'+t.id+'" title="Complete in Odoo">○</button>'
    +'<div class="obody"><div class="oname">'+flag+esc(t.name)+'</div>'
    +'<div class="ometa">'+proj
    +'<label class="datepick mini '+(over?'over ':'')+(d?'set':'')+'"><span class="dpi">📅</span><span class="dptxt">'+esc(label)+(over?' · overdue':'')+'</span>'
    +'<input type="date" class="odate" data-oid="'+t.id+'" value="'+esc(val)+'"></label>'

}
function odooBoardBody(){
  if(!ODOO.loaded && !ODOO.loading){ setTimeout(function(){loadOdoo();},0); }
  if(ODOO.err) return '<div class="ohead"><button class="orefresh" data-orefresh="1">↻ retry</button></div><div class="oempty">Couldn’t load Odoo: '+esc(ODOO.err)+'</div>';
  if(ODOO.loading && !ODOO.tasks.length) return '<div class="oempty">Loading your Odoo tasks…</div>';
  if(!ODOO.loaded) return '<div class="oempty">…</div>';
  const today=todayISO();
  const wkd=new Date(today+'T00:00:00'); wkd.setDate(wkd.getDate()+7); const wkKey=odooInputVal(wkd);
  const B={over:[],today:[],week:[],later:[],none:[]};
  ODOO.tasks.forEach(function(t){ const d=odooDate(t.deadline); const k=d?odooInputVal(d):'';
    if(!k) B.none.push(t); else if(k<today) B.over.push(t); else if(k===today) B.today.push(t); else if(k<=wkKey) B.week.push(t); else B.later.push(t); });
  const order=[['over','Overdue',true],['today','Today',false],['week','This week',false],['later','Later',false],['none','No date',false]];
  let h='<div class="ohead"><button class="orefresh" data-orefresh="1">↻ refresh</button></div>';
  let any=false;
  order.forEach(function(o){ const list=B[o[0]]; if(!list.length) return; any=true;
    list.sort(function(a,b){ const da=a.deadline||'',db=b.deadline||''; return da<db?-1:da>db?1:0; });
    h+='<div class="ogrp"><p class="lab'+(o[2]?' over':'')+'">'+o[1]+'<span class="count">'+list.length+'</span></p>'+list.map(odooRow).join('')+'</div>';
  });
  if(!any) h+='<div class="oempty">Nothing open in Odoo — you’re clear. 🌟</div>';
  return h;
}

// ---- route every active/waitingOn/done task to exactly one category board ----
function routeTasks(){
  const map={ 'd-one':[], 'wealth':[], 'growth':[], 'family':[] };
  const cats=[['d-one',['d-one']],['wealth',['finance']],['family',['family','marriage','home','adventure']],['growth',['self','social','ideas']]];
  ['active','waitingOn','done'].forEach(col=>{
    arr(DATA.tasks[col]).forEach((t,i)=>{
      const tags=arr(t.tags); let dest='growth';
      for(const [id,set] of cats){ if(tags.some(x=>set.includes(x))){ dest=id; break; } }
      map[dest].push({col,i});
    });
  });
  return map;
}
function taskItem(col, i){
  const t=DATA.tasks[col][i]; const bp='tasks.'+col+'.'+i;
  const isWaiting = ('since' in t);
  const today=todayISO();

  // priority star
  const star = `<button class="star ${t.flag?'on':''}" data-flag="${bp}.flag" title="${t.flag?'Priority \u2014 tap to clear':'Flag as priority'}">${t.flag?'\u2605':'\u2606'}</button>`;

  // date control: calendar picker (or 'since' text for waiting-on items)
  let dateCtl;
  if(isWaiting){
    dateCtl = `<span class="chip time">since ${ed(bp+'.since', t.since||'', '\u2014')}</span>`;
  } else {
    const overdue = t.due && t.due<today;
    dateCtl = `<label class="datepick ${overdue?'over':''} ${t.due?'set':''}">
      <span class="dpi">\ud83d\udcc5</span>
      <span class="dptxt">${t.due?esc(fmtDue(t.due))+(overdue?' \u00b7 overdue':''):'set due date'}</span>
      <input type="date" class="dateinput" data-datepath="${bp}.due" value="${esc(t.due||'')}">
    </label>`;
  }

  // tags: assigned chips + a toggle to open the full picker
  const assigned = arr(t.tags);
  let tagHTML;
  if(openTagPickers.has(bp)){
    tagHTML = `<div class="tagpick">`+TAGS.map(tag=>{
      const on=assigned.includes(tag);
      return `<button class="tagchip ${on?'on':''} ${tag==='Odoo'?'odoo':''}" data-tagset="${bp}" data-tag="${esc(tag)}">${on?'\u2713 ':''}${esc(tag)}</button>`;
    }).join('')+`<button class="tagdone" data-tagclose="${bp}">done</button></div>`;
  } else {
    const chips = assigned.length
      ? assigned.map(tag=>`<span class="chip ${tag==='Odoo'?'odoo':''}">${esc(tag)}</span>`).join('')
      : '';
    tagHTML = `<div class="tagrow">${chips}<button class="tagadd" data-tagopen="${bp}">\ud83c\udff7\ufe0f ${assigned.length?'edit tags':'add tag'}</button></div>`;
  }

  // Odoo routing panel (only when tagged Odoo)
  const odooHTML = assigned.includes('Odoo') ? odooPanel(bp, t.odoo||{}) : '';

  return `<div class="task ${t.done?'isdone':''} ${t.flag?'flagged':''}">${tick(bp+'.done', t.done)}
    <div class="body">
      <div class="thead">${star}<div class="t">${ed(bp+'.title', t.title,'action\u2026')}</div></div>
      <div class="c">${ed(bp+'.context', t.context,'context\u2026')}</div>
      <div class="meta">${dateCtl}</div>
      ${tagHTML}
      ${odooHTML}
    </div>${del('tasks.'+col,i)}</div>`;
}

function taskGroupHTML(refs, seedTag){
  const byCol={active:[],waitingOn:[],done:[]};
  sortTaskRefs(refs).forEach(r=>{ if(byCol[r.col]) byCol[r.col].push(r.i); });
  // checked-off active tasks auto-archive into the collapsed Done section
  const activeOpen = byCol.active.filter(i=>!DATA.tasks.active[i].done);
  const activeDone = byCol.active.filter(i=>DATA.tasks.active[i].done);
  let h='';
  // open tasks
  h+=`<div class="grp tsk active"><p class="lab">Tasks<span class="count">${activeOpen.length}</span></p>`;
  h+= activeOpen.map(i=>taskItem('active',i)).join('') || '<p class="empty">Nothing here.</p>';
  h+= add('tasks.active','taskActive','add', seedTag)+`</div>`;
  // waiting on (only when present)
  if(byCol.waitingOn.length){
    h+=`<div class="grp tsk waitingOn"><p class="lab">Waiting on<span class="count">${byCol.waitingOn.length}</span></p>`;
    h+= byCol.waitingOn.map(i=>taskItem('waitingOn',i)).join('');
    h+= add('tasks.waitingOn','taskWaiting','add')+`</div>`;
  }
  // Done — archived: checked-off active tasks + anything in tasks.done, collapsed
  const doneRefs = activeDone.map(i=>({col:'active',i})).concat(byCol.done.map(i=>({col:'done',i})));
  if(doneRefs.length) h+= doneBox('done_'+(seedTag||'x'), doneRefs);
  return h;
}
// collapsed "Done" archive for one task group
function doneBox(keyId, doneRefs){
  const open = boardOpen(keyId, false);
  let h=`<details class="donebox" data-board="${esc(keyId)}"${open?' open':''}>
    <summary><span class="dtick">✓</span><span class="dlab">Done</span><span class="count">${doneRefs.length}</span><span class="bchev">▾</span></summary>
    <div class="donebody">`;
  h+= doneRefs.map(r=>taskItem(r.col, r.i)).join('');
  h+=`</div></details>`;
  return h;
}

// -------- templates for new items --------
function template(kind){
  switch(kind){
    case 'string': return {text:'',done:false};
    case 'q': return '';
    case 'focus': return {title:'',detail:'',done:false};
    case 'watch': return {title:'',detail:'',owner:'',done:false};
    case 'check': return {text:'',done:false};
    case 'deleg': return {person:'',owns:''};
    case 'stage': return {text:''};
    case 'taskActive': case 'taskSomeday': return {title:'',context:'',tags:[],flag:false,due:null,odoo:null,done:false};
    case 'taskWaiting': return {title:'',context:'',tags:[],flag:false,since:todayISO(),odoo:null,done:false};
    case 'taskDone': return {title:'',context:'',tags:[],flag:false,due:null,odoo:null,done:true};
    default: return {text:'',done:false};
  }
}

// -------- dirty / save --------
function markDirty(){ dirty=true; $("#savebar").classList.add('show'); $("#saveMsg").textContent='Unsaved changes'; }
function toast(msg, err){ const t=$("#toast"); t.textContent=msg; t.className='toast show'+(err?' err':''); setTimeout(()=>t.className='toast',2600); }

async function save(){
  const btn=$("#saveBtn"); btn.disabled=true; $("#saveMsg").textContent='Saving…';
  DATA.meta.updated = todayISO();
  const payload = { data: DATA, message: 'Update brain via dashboard', password: getPw()||undefined };
  try{
    const res = await fetch('/.netlify/functions/save', {method:'POST', headers:{'Content-Type':'application/json', ...pwHeaders()}, body:JSON.stringify(payload)});
    if(res.status===401){
      if(promptUnlock()){ btn.disabled=false; return save(); }
      btn.disabled=false; $("#saveMsg").textContent='Unsaved changes'; toast('Locked — password needed to save', true); return;
    }
    if(!res.ok){ const j=await res.json().catch(()=>({})); throw new Error(j.error||('HTTP '+res.status)); }
    const j=await res.json();
    dirty=false; $("#savebar").classList.remove('show');
    $("#updated").textContent="Updated "+DATA.meta.updated+(DATA.meta.rule?" · "+DATA.meta.rule:"");
    toast('Saved ✓'+(j.commit?(' · '+j.commit.slice(0,7)):''));
  }catch(e){
    btn.disabled=false; $("#saveMsg").textContent='Unsaved changes';
    if(String(e).includes('Failed to fetch')||String(e).includes('NetworkError'))
      toast('Preview mode — Save works on the live site', true);
    else toast('Save failed: '+e.message, true);
    return;
  }
  btn.disabled=false;
}

app.addEventListener('click', e=>{
  const t=e.target.closest('[data-tick]');
  if(t){ const p=t.getAttribute('data-tick'); const nv=!getP(p); setP(p, nv);
    const stamp=t.getAttribute('data-stamp');
    if(stamp){ setP(stamp, nv? new Date().toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}) : ''); }
    markDirty(); render(); return; }
  const en=e.target.closest('[data-energy]');
  if(en){ const n=+en.getAttribute('data-energy'); const cur=getP('dailyCheckin.evening.energy');
    setP('dailyCheckin.evening.energy', cur===n?null:n); markDirty(); render(); return; }
  const d=e.target.closest('[data-del]');
  if(d){ const ap=d.getAttribute('data-del'); const i=+d.getAttribute('data-idx'); const a=getP(ap); a.splice(i,1); markDirty(); render(); return; }
  const a=e.target.closest('[data-add]');
  if(a){ const ap=a.getAttribute('data-add'); const kind=a.getAttribute('data-kind'); const seed=a.getAttribute('data-seed');
    const item=template(kind); if(seed && item && typeof item==='object' && 'tags' in item) item.tags=[seed];
    getP(ap).push(item); markDirty(); render(); return; }
  // priority star
  const fl=e.target.closest('[data-flag]');
  if(fl){ const p=fl.getAttribute('data-flag'); setP(p, !getP(p)); markDirty(); render(); return; }
  // open / close the tag picker for one task
  const to=e.target.closest('[data-tagopen]');
  if(to){ openTagPickers.add(to.getAttribute('data-tagopen')); render(); return; }
  const tcl=e.target.closest('[data-tagclose]');
  if(tcl){ openTagPickers.delete(tcl.getAttribute('data-tagclose')); render(); return; }
  // toggle a tag on/off directly
  const tg=e.target.closest('[data-tagset]');
  if(tg){ const bp=tg.getAttribute('data-tagset'); const tag=tg.getAttribute('data-tag');
    const tobj=getP(bp); const tags=arr(tobj.tags); const idx=tags.indexOf(tag);
    if(idx>=0) tags.splice(idx,1); else tags.push(tag); tobj.tags=tags;
    if(tag==='Odoo' && tags.includes('Odoo') && !tobj.odoo)
      tobj.odoo={dest:'Project',project:'',assignee:'',stage:'',deadline:'',status:'pending',odooId:null,pushedAt:''};
    markDirty(); render(); return; }
  // Odoo destination module
  const od=e.target.closest('[data-odest]');
  if(od){ const bp=od.getAttribute('data-odest'); const v=od.getAttribute('data-destval');
    const o=getP(bp+'.odoo')||{}; o.dest=v; setP(bp+'.odoo', o); markDirty(); render(); return; }
  // push this action into Odoo
  const op=e.target.closest('[data-odoopush]');
  if(op){ pushToOdoo(op.getAttribute('data-odoopush')); return; }
});

// push one Odoo-tagged action live to Odoo via the API
async function pushToOdoo(bp){
  const t=getP(bp); const o=t.odoo||{};
  if(!o.project || !o.project.trim()){ toast('Add a Project / pipeline name first', true); openTagPickers.add(bp); render(); return; }
  try{
    const res=await fetch('/.netlify/functions/odoo', {method:'POST',
      headers:{'Content-Type':'application/json', ...pwHeaders()},
      body:JSON.stringify({ password:getPw()||undefined, task:{
        title:t.title, context:t.context, dest:o.dest||'Project',
        project:o.project, assignee:o.assignee, stage:o.stage,
        deadline:o.deadline||t.due||'' } })});
    if(res.status===401){ if(promptUnlock()) return pushToOdoo(bp); throw new Error('Locked — password needed'); }
    const j=await res.json().catch(()=>({}));
    if(!res.ok || !j.ok) throw new Error(j.error||('HTTP '+res.status));
    o.status='synced'; o.odooId=j.id||o.odooId; o.pushedAt=todayISO(); t.odoo=o;
    markDirty(); render(); toast('Pushed to Odoo ✓'+(j.id?(' · #'+j.id):''));
    save();
  }catch(e){
    if(String(e).includes('Failed to fetch')||String(e).includes('NetworkError'))
      toast('Odoo push works on the live site', true);
    else toast('Odoo push failed: '+e.message, true);
  }
}

  const bn=e.target.closest('[data-all]'); if(!bn) return;
  const open = bn.getAttribute('data-all')==='1';
  document.querySelectorAll('details.board').forEach(x=>{ x.open=open; setBoardOpen(x.getAttribute('data-board'), open); });
});
// Today toggle
app.addEventListener('click', e=>{
  const tb=e.target.closest('[data-today]'); if(!tb) return;
  todayOnly=!todayOnly; render();
});
app.addEventListener('click', e=>{
  const tb=e.target.closest('[data-tab]'); if(!tb) return;
  setTab(tb.getAttribute('data-tab')); render();
});
// Odoo: refresh / complete / reschedule
app.addEventListener('click', e=>{
  const rf=e.target.closest('[data-orefresh]'); if(rf){ loadOdoo(true); }
});
app.addEventListener('click', async e=>{
  const dn=e.target.closest('[data-odone]'); if(!dn) return;
  const id=Number(dn.getAttribute('data-odone'));
  dn.textContent='…'; dn.disabled=true;
  try{ await odooUpdate(id,{done:true}); ODOO.tasks=ODOO.tasks.filter(t=>t.id!==id); toast('Completed in Odoo ✓'); render(); }
  catch(err){ toast('Odoo: '+err.message,true); dn.textContent='○'; dn.disabled=false; }
});
app.addEventListener('change', async e=>{
  const di=e.target.closest('.odate'); if(!di) return;
  const id=Number(di.getAttribute('data-oid')); const val=di.value||'';
  try{ await odooUpdate(id,{deadline:val}); const t=ODOO.tasks.find(x=>x.id===id); if(t) t.deadline= val?(val+' 10:00:00'):null; toast('Rescheduled in Odoo ✓'); render(); }
  catch(err){ toast('Odoo: '+err.message,true); }
});
app.addEventListener('click', e=>{ const di=e.target.closest('.odate'); if(di && typeof di.showPicker==='function'){ try{di.showPicker();}catch(_){} } });
$("#saveBtn").addEventListener('click', save);
$("#refreshBtn").addEventListener('click', ()=>{
  if(dirty && !confirm('Discard unsaved changes and reload from the server?')) return;
  load(true); loadOdoo(true);
});
$("#lockBtn").addEventListener('click', ()=>{ setPw(''); location.reload(); });
$("#autoToggle").addEventListener('click', ()=>{
  autoOn=!autoOn; $("#autoSwitch").classList.toggle('on',autoOn);
  if(timer){clearInterval(timer);timer=null;}
  if(autoOn) timer=setInterval(()=>{ if(!dirty) load(true); },60000);
});

// -------- load --------
function updateLockBtn(show){ const b=$("#lockBtn"); if(b) b.style.display = show?'inline-flex':'none'; }
async function load(showSpin){
  const spin=$("#spin"); if(showSpin) spin.classList.add('show');
  try{
    let res=await fetch('/.netlify/functions/brain',{cache:'no-store', headers: pwHeaders()});
    if(res.status===401){
      updateLockBtn(true);
      if(!promptUnlock()){ showLocked(); spin.classList.remove('show'); return; }
      res=await fetch('/.netlify/functions/brain',{cache:'no-store', headers: pwHeaders()});
      if(res.status===401){ setPw(''); showLocked(); spin.classList.remove('show'); return; }
    }
    if(!res.ok) throw new Error('HTTP '+res.status);
    DATA=normalize(await res.json());
    updateLockBtn(!!getPw());
    $("#infoBanner").classList.remove('show');
    dirty=false; $("#savebar").classList.remove('show');
    render();
  }catch(e){
    DATA=normalize(JSON.parse(JSON.stringify(FALLBACK)));
    const b=$("#infoBanner"); b.textContent="Preview data — not yet connected to the live repo. Editing here is a demo; on the hosted site, Save commits to GitHub."; b.classList.add('show');
    render();
  }finally{ spin.classList.remove('show'); }
}

load(true);
</script>
</body>
</html>
