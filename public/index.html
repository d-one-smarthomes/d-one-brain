<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>D-One · Central Brain</title>
<style>
  :root{
    --blue:#1379C9; --blue-dim:#1f5f96; --blue-soft:rgba(19,121,201,.14);
    --bg:#0b131d; --bg2:#0f1a26; --panel:#131f2d; --panel2:#172536;
    --line:#213348; --line-soft:#1a2836;
    --ink:#eaf1f8; --ink2:#a9bacb; --ink3:#6f8296;
    --good:#3fbf8f; --warn:#e0a53d; --recede:#8194a7; --danger:#e05555;
    --radius:16px; --shadow:0 1px 0 rgba(255,255,255,.03), 0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 50% -10%, #12263a 0%, var(--bg) 55%) fixed;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5; letter-spacing:.1px; padding:0 0 96px;
  }
  a{color:var(--blue)}
  .wrap{max-width:960px;margin:0 auto;padding:0 16px}

  header{position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg, rgba(11,19,29,.96), rgba(11,19,29,.86));
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft)}
  .hrow{display:flex;align-items:center;gap:12px;padding:14px 16px;max-width:960px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px var(--blue-soft);flex:none}
  .brand h1{font-size:16px;font-weight:700;margin:0;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .spacer{flex:1}
  .ctl{display:flex;align-items:center;gap:8px}
  .btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);
    font-size:13px;font-weight:600;padding:8px 12px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .btn:active{transform:translateY(1px)}
  .btn.icon{padding:8px 10px}
  .toggle{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);user-select:none;cursor:pointer}
  .switch{width:34px;height:20px;border-radius:20px;background:var(--line);position:relative;transition:.2s;flex:none}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
  .switch.on{background:var(--blue)} .switch.on::after{left:16px}
  .updated{font-size:11px;color:var(--ink3);padding:0 16px 10px;max-width:960px;margin:0 auto;display:flex;gap:8px;align-items:center}
  .spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--blue);animation:sp .7s linear infinite;display:none}
  .spin.show{display:inline-block}
  @keyframes sp{to{transform:rotate(360deg)}}

  section{margin:26px 0}
  .sec-head{display:flex;align-items:center;gap:10px;margin:0 0 12px;padding:0 2px}
  .sec-head .k{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--blue);text-transform:uppercase}
  .sec-head .l{width:26px;height:2px;background:var(--blue);border-radius:2px;opacity:.5}
  .sec-head h2{font-size:19px;font-weight:700;margin:0}
  .muted{color:var(--ink3);font-size:13px;margin:0 2px 14px}
  .panel{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line-soft);border-radius:var(--radius);box-shadow:var(--shadow)}
  .pad{padding:16px 18px}

  /* editable + controls */
  .edit{cursor:text;border-radius:5px;padding:0 3px;transition:background .12s;min-width:8px;display:inline-block}
  .edit:empty:before{content:attr(data-ph);color:var(--ink3);opacity:.7}
  .edit:hover{background:rgba(255,255,255,.05)}
  .edit:focus{background:rgba(19,121,201,.16);outline:none;box-shadow:inset 0 0 0 1px var(--blue-dim)}
  .tick{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);background:transparent;cursor:pointer;flex:none;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800;padding:0}
  .tick.on{background:var(--good);border-color:var(--good)}
  .del{border:none;background:transparent;color:var(--ink3);cursor:pointer;font-size:17px;line-height:1;padding:2px 7px;border-radius:6px;flex:none}
  .del:hover{color:#fff;background:rgba(224,85,85,.28)}
  .del.txt{font-size:12px;font-weight:600;padding:3px 9px}
  .add{display:inline-flex;align-items:center;gap:6px;margin-top:9px;border:1px dashed var(--line);background:transparent;color:var(--ink3);border-radius:10px;padding:6px 12px;font-size:12.5px;cursor:pointer}
  .add:hover{color:var(--blue);border-color:var(--blue-dim)}
  .irow{display:flex;align-items:center;gap:9px;padding:4px 0}
  .irow .edit{flex:1;font-size:13.5px;color:var(--ink2)}
  .isdone > .edit,.isdone .rtext{text-decoration:line-through;color:var(--ink3)!important}

  .three{display:grid;grid-template-columns:1fr;gap:14px}
  .fcard{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);
    border-left:3px solid var(--blue);border-radius:var(--radius);padding:18px 18px 14px;position:relative;overflow:hidden}
  .fcard .n{position:absolute;top:8px;right:14px;font-size:40px;font-weight:800;color:var(--blue-soft);line-height:1}
  .fcard h3{margin:0 44px 8px 0;font-size:17px;font-weight:700}
  .fcard .rtext.det{color:var(--ink2);font-size:14px;display:block;margin-bottom:10px}
  .cardfoot{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line-soft);padding-top:10px;margin-top:2px}
  .cardfoot .lbl{font-size:12px;color:var(--ink3)}
  .isdone.fcard h3 .rtext{text-decoration:line-through;color:var(--ink3)}

  .strip{margin-top:16px}
  .strip .lab{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--recede);margin:0 0 8px}
  .watch{display:flex;flex-direction:column;gap:8px}
  .witem{background:var(--panel);border:1px solid var(--line-soft);border-radius:12px;padding:11px 13px;display:flex;gap:10px;align-items:flex-start}
  .witem .body{flex:1;min-width:0}
  .witem .t{font-weight:650;font-size:14px}
  .witem .d{color:var(--ink3);font-size:12.5px;margin-top:3px}
  .owner-row{margin-top:7px;font-size:11px}
  .owner-row .edit{color:var(--blue);background:var(--blue-soft);border-radius:999px;padding:2px 9px;font-weight:700}

  details.filter{border:1px solid var(--line-soft);border-radius:var(--radius);background:linear-gradient(180deg,var(--panel),var(--bg2));overflow:hidden}
  details.filter>summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;gap:12px}
  details.filter>summary::-webkit-details-marker{display:none}
  details.filter>summary .ttl{font-weight:700;font-size:16px}
  details.filter>summary .hint{color:var(--ink3);font-size:12px}
  details.filter>summary .chev{margin-left:auto;transition:.2s;color:var(--ink3)}
  details.filter[open]>summary .chev{transform:rotate(180deg)}
  .filter .body{padding:2px 18px 18px}
  .filter .intro{color:var(--ink2);font-size:13.5px;margin:0 0 12px}
  .qlist{display:flex;flex-direction:column;gap:10px;margin:0 0 16px;padding:0;list-style:none}
  .qrow{position:relative;padding:12px 40px 12px 14px;background:var(--panel);border:1px solid var(--line-soft);border-radius:12px;font-size:14px;color:var(--ink)}
  .qrow .del{position:absolute;right:6px;top:9px}
  .mottos{display:grid;grid-template-columns:1fr;gap:10px}
  .motto{border-left:3px solid var(--blue);padding:8px 0 8px 14px}
  .motto .m{font-size:15px;font-weight:650;font-style:italic}
  .motto .cap{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--recede);font-weight:800}

  .areas{display:grid;grid-template-columns:1fr;gap:14px}
  .area .pad{padding:16px 18px 18px}
  .area .top{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
  .area .badge{font-size:12px;font-weight:800;color:var(--blue);background:var(--blue-soft);border-radius:8px;padding:2px 8px;flex:none}
  .area h3{margin:0;font-size:16px;font-weight:700}
  .area .stitle{color:var(--ink3);font-size:12.5px;margin:0 0 12px}
  .grp{margin-top:12px}
  .grp .lab{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;margin:0 0 5px;display:flex;align-items:center;gap:7px}
  .grp.now .lab{color:var(--blue)} .grp.del2 .lab{color:var(--good)} .grp.park .lab{color:var(--recede)} .grp.extra .lab{color:var(--ink2)}
  .empty{color:var(--ink3);font-size:12.5px;font-style:italic}

  .table{width:100%;border-collapse:collapse;font-size:13.5px}
  .trow{display:flex;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line-soft)}
  .trow:last-child{border-bottom:none}
  .trow .who{font-weight:700;color:var(--ink);flex:none;width:34%;max-width:130px}
  .trow .owns{color:var(--ink2);flex:1}

  .cols{display:grid;grid-template-columns:1fr;gap:14px}
  .col .lab{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink2);margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .col .count{font-size:11px;color:var(--ink3);background:var(--panel);border:1px solid var(--line-soft);border-radius:999px;padding:1px 8px}
  .task{background:var(--panel);border:1px solid var(--line-soft);border-radius:12px;padding:11px 12px;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start}
  .task .body{flex:1;min-width:0}
  .task .t{font-weight:650;font-size:14px}
  .task .c{color:var(--ink3);font-size:12.5px;margin-top:4px}
  .task .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:9px}
  .chip{font-size:11px;font-weight:700;background:var(--blue-soft);color:var(--blue);border-radius:999px;padding:2px 9px}
  .chip.time{background:transparent;border:1px solid var(--line);color:var(--ink3);font-weight:600}
  .chip.time .edit{color:var(--ink2)}
  .task.isdone .t .rtext{text-decoration:line-through;color:var(--ink3)}

  .goal .name{font-size:20px;font-weight:800;margin:0}
  .goal .tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--blue);margin-bottom:4px}
  .goal .stmt{color:var(--ink2);font-size:14px;margin:8px 0 16px}
  .checks{display:flex;flex-direction:column;gap:10px;margin:0 0 14px;padding:0;list-style:none}
  .crow{display:flex;gap:11px;align-items:flex-start;font-size:14px;color:var(--ink)}
  .crow .edit{flex:1}
  .crow.isdone .edit{text-decoration:line-through;color:var(--ink3)}
  .success{background:var(--blue-soft);border:1px solid var(--blue-dim);border-radius:12px;padding:13px 15px;font-size:13.5px;color:var(--ink)}
  .success b{color:var(--blue)}

  .flow{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;-webkit-overflow-scrolling:touch;flex-wrap:wrap}
  .stage{flex:none;display:flex;align-items:center;gap:6px}
  .stage .box2{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:12.5px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px}
  .stage .box2 .num{color:var(--blue);font-weight:800;font-size:11px}
  .stage .del{font-size:13px;padding:0 4px}

  .park-list{display:flex;flex-direction:column;gap:6px}

  .banner{border-radius:12px;padding:12px 15px;font-size:13px;margin:16px 0;display:none}
  .banner.info{background:var(--blue-soft);border:1px solid var(--blue-dim);color:var(--ink2)}
  .banner.show{display:block}
  footer{text-align:center;color:var(--ink3);font-size:11px;margin-top:40px}

  .savebar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:12px;align-items:center;justify-content:center;
    padding:12px 16px;background:linear-gradient(0deg,rgba(11,19,29,.99),rgba(11,19,29,.9));border-top:1px solid var(--line-soft);
    transform:translateY(130%);transition:transform .22s}
  .savebar.show{transform:none}
  .savebar .msg{font-size:13px;color:var(--ink2)}
  .savebar .save{background:var(--blue);border:none;color:#fff;font-weight:700;padding:10px 20px;border-radius:10px;cursor:pointer;font-size:14px}
  .savebar .save:disabled{opacity:.55}
  .toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:10px 16px;border-radius:10px;font-size:13px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
  .toast.show{opacity:1}
  .toast.err{border-color:var(--danger);color:#f3c0c0}

  @media(min-width:680px){
    .three{grid-template-columns:repeat(3,1fr)}
    .areas{grid-template-columns:1fr 1fr}
    .cols{grid-template-columns:1fr 1fr}
    .mottos{grid-template-columns:1fr 1fr}
  }
</style>
</head>

const arr = x => Array.isArray(x)?x:[];

  wf.todayQuick = arr(wf.todayQuick).map(toItem);
  d.areas = arr(d.areas).map(a=>{
    a = Object.assign({key:'',name:'',subtitle:''}, a);
    ['now','delegated','parked','bhags','skillsToPolish','pipelines'].forEach(k=>{ if(k in a || ['now','delegated','parked'].includes(k)) a[k]=arr(a[k]).map(toItem); });
    return a;
  });
  d.delegation = arr(d.delegation).map(p=> Object.assign({person:'',owns:''}, p));
  d.salesJourney = d.salesJourney || {};
  d.salesJourney.stages = arr(d.salesJourney.stages).map(s=> (s&&typeof s==='object')?Object.assign({text:''},s):{text:String(s||'')});
  d.monthlyGoal = Object.assign({title:'',statement:'',success:'',checklist:[]}, d.monthlyGoal);
  d.monthlyGoal.checklist = arr(d.monthlyGoal.checklist).map(c=> Object.assign({text:'',done:false}, (c&&typeof c==='object')?c:{text:String(c||'')}));
  d.tasks = Object.assign({active:[],waitingOn:[],someday:[],done:[]}, d.tasks);
  ['active','waitingOn','someday','done'].forEach(col=>{
    d.tasks[col] = arr(d.tasks[col]).map(t=> Object.assign({title:'',context:'',tags:[],done:(col==='done')}, t, {tags:arr(t&&t.tags)}));
  });
  d.parkingLot = arr(d.parkingLot).map(toItem);
  d.energyLog = arr(d.energyLog);
  return d;
}

// -------- markup helpers --------
function ed(path, val, ph){ return `<span class="edit rtext" contenteditable="true" data-path="${path}"${ph?` data-ph="${esc(ph)}"`:''}>${esc(val||'')}</span>`; }
function tick(path, done){ return `<button class="tick ${done?'on':''}" data-tick="${path}">${done?'✓':''}</button>`; }
function del(arrPath, i, cls){ return `<button class="del ${cls||''}" data-del="${arrPath}" data-idx="${i}">${cls==='txt'?'remove':'×'}</button>`; }
function add(arrPath, kind, label){ return `<button class="add" data-add="${arrPath}" data-kind="${kind}">+ ${label||'add'}</button>`; }

function secHead(k,title){return `<div class="sec-head"><span class="k">${esc(k)}</span><span class="l"></span><h2>${esc(title)}</h2></div>`;}

// generic tickable string-item list (area lines, parking lot, todayQuick)
function itemList(basePath, kind){
  const list = getP(basePath) || [];
  const rows = list.map((o,i)=>`<div class="irow ${o.done?'isdone':''}">${tick(basePath+'.'+i+'.done', o.done)}${ed(basePath+'.'+i+'.text', o.text)}${del(basePath,i)}</div>`).join('');
  return `<div>${rows||'<p class="empty">—</p>'}${add(basePath,kind)}</div>`;
}

function render(){
  const d=DATA;
  $("#title").textContent = (d.meta&&d.meta.title) || "D-One · Central Brain";
  $("#updated").textContent = "Updated "+(d.meta.updated||'—')+(d.meta.rule?" · "+d.meta.rule:"");
  let h="";

  // WEEKLY FOCUS
  const wf=d.weeklyFocus;
  h+=`<section>${secHead("Focus","This Week")}<p class="muted">${ed('weeklyFocus.note', wf.note,'note…')}</p><div class="three">`;
  h+= wf.three.map((t,i)=>`<div class="fcard ${t.done?'isdone':''}"><span class="n">${i+1}</span>
      <h3>${ed('weeklyFocus.three.'+i+'.title', t.title,'focus…')}</h3>
      <span class="rtext det">${ed('weeklyFocus.three.'+i+'.detail', t.detail,'detail…')}</span>
      <div class="cardfoot">${tick('weeklyFocus.three.'+i+'.done', t.done)}<span class="lbl">done</span>${del('weeklyFocus.three',i,'txt')}</div></div>`).join('');
  h+=`</div>${add('weeklyFocus.three','focus','add focus')}`;
  // watching
  h+=`<div class="strip"><p class="lab">Watching</p><div class="watch">`;
  h+= wf.watching.map((it,i)=>`<div class="witem ${it.done?'isdone':''}">${tick('weeklyFocus.watching.'+i+'.done', it.done)}
      <div class="body"><div class="t">${ed('weeklyFocus.watching.'+i+'.title', it.title)}</div>
      <div class="d">${ed('weeklyFocus.watching.'+i+'.detail', it.detail,'detail…')}</div>
      <div class="owner-row">owner: ${ed('weeklyFocus.watching.'+i+'.owner', it.owner,'—')}</div></div>${del('weeklyFocus.watching',i)}</div>`).join('');
  h+=`</div>${add('weeklyFocus.watching','watch','add')}</div>`;
  // today quick
  h+=`<div class="strip"><p class="lab">Today — quick</p>${itemList('weeklyFocus.todayQuick','string')}</div></section>`;

  // ONE FILTER
  const f=d.oneFilter;
  h+=`<section><details class="filter"><summary><span class="ttl">The One Filter</span><span class="hint">tap to expand</span><span class="chev">▾</span></summary><div class="body">
      <p class="intro">${ed('oneFilter.intro', f.intro)}</p><ul class="qlist">`;
  h+= f.questions.map((q,i)=>`<li class="qrow">${ed('oneFilter.questions.'+i, q)}${del('oneFilter.questions',i)}</li>`).join('');
  h+=`</ul>${add('oneFilter.questions','q','add question')}<div class="mottos" style="margin-top:14px">
      <div class="motto"><div class="cap">Scorekeeping</div><div class="m">${ed('oneFilter.gp', f.gp)}</div></div>
      <div class="motto"><div class="cap">Rhythm</div><div class="m">${ed('oneFilter.oneThing', f.oneThing)}</div></div>
      </div></div></details></section>`;

  // AREAS
  h+=`<section>${secHead("Areas","Priorities by area")}<div class="areas">`;
  h+= d.areas.map((a,ai)=>{
    let g='';
    const grp=(label,key,cls)=> a[key]&&a[key].length!==undefined ? `<div class="grp ${cls}"><p class="lab">${label}</p>${itemList('areas.'+ai+'.'+key,'string')}</div>` : '';
    g+=grp('Now','now','now');
    g+=grp('Delegated','delegated','del2');
    g+=grp('Parked','parked','park');
    if(a.bhags) g+=`<div class="grp extra"><p class="lab">Big goals</p>${itemList('areas.'+ai+'.bhags','string')}</div>`;
    if(a.skillsToPolish) g+=`<div class="grp extra"><p class="lab">Skills to polish</p>${itemList('areas.'+ai+'.skillsToPolish','string')}</div>`;
    if(a.pipelines) g+=`<div class="grp extra"><p class="lab">Pipelines</p>${itemList('areas.'+ai+'.pipelines','string')}</div>`;
    return `<div class="panel area"><div class="pad">
      <div class="top"><span class="badge">${esc(a.key||'')}</span><h3>${ed('areas.'+ai+'.name', a.name)}</h3></div>
      <p class="stitle">${ed('areas.'+ai+'.subtitle', a.subtitle,'subtitle…')}</p>${g}</div></div>`;
  }).join('');
  h+=`</div></section>`;

  // DELEGATION
  h+=`<section>${secHead("Team","Delegation map")}<div class="panel"><div class="pad">`;
  h+= d.delegation.map((p,i)=>`<div class="trow"><span class="who">${ed('delegation.'+i+'.person', p.person)}</span><span class="owns">${ed('delegation.'+i+'.owns', p.owns)}</span>${del('delegation',i)}</div>`).join('');
  h+=`${add('delegation','deleg','add person')}</div></div></section>`;

  // TASKS
  h+=`<section>${secHead("Tasks","Tasks")}<div class="cols">`;
  h+= taskCol('Active','active','taskActive');
  h+= taskCol('Waiting on','waitingOn','taskWaiting');
  h+= taskCol('Someday','someday','taskSomeday');
  h+= taskCol('Done','done','taskDone');
  h+=`</div></section>`;

  // MONTHLY GOAL
  const g=d.monthlyGoal;
  h+=`<section>${secHead("Goal","Monthly goal")}<div class="panel goal"><div class="pad"><span class="tag">This month</span>
      <p class="name">${ed('monthlyGoal.title', g.title)}</p>
      <p class="stmt">${ed('monthlyGoal.statement', g.statement)}</p><ul class="checks">`;
  h+= g.checklist.map((c,i)=>`<li class="crow ${c.done?'isdone':''}">${tick('monthlyGoal.checklist.'+i+'.done', c.done)}${ed('monthlyGoal.checklist.'+i+'.text', c.text)}${del('monthlyGoal.checklist',i)}</li>`).join('');
  h+=`</ul>${add('monthlyGoal.checklist','check','add step')}
      <div class="success"><b>What success is:</b> ${ed('monthlyGoal.success', g.success)}</div></div></div></section>`;

  // SALES JOURNEY
  const s=d.salesJourney;
  h+=`<section>${secHead("Process","Sales journey")}<div class="panel"><div class="pad">
      <p class="stitle">${ed('salesJourney.credibility', s.credibility)}</p><div class="flow">`;
  h+= s.stages.map((st,i)=>`<div class="stage"><div class="box2"><span class="num">${i+1}</span>${ed('salesJourney.stages.'+i+'.text', st.text)}${del('salesJourney.stages',i)}</div></div>`).join('');
  h+=`</div>${add('salesJourney.stages','stage','add stage')}
      <p class="stitle" style="margin-top:10px">${ed('salesJourney.question', s.question)}</p></div></div></section>`;

  // PARKING LOT
  h+=`<section>${secHead("Later","Parking lot")}<div class="park-list">${itemList('parkingLot','string')}</div></section>`;

  $("#app").innerHTML=h;
}

function taskCol(label, col, kind){
  const list = DATA.tasks[col]||[];
  let h=`<div class="col"><p class="lab">${label}<span class="count">${list.length}</span></p>`;
  h+= list.map((t,i)=>{
    const bp='tasks.'+col+'.'+i;
    const tags=(t.tags||[]).map(x=>esc(x)).join(', ');
    const when = ('since' in t) ? `since ${ed(bp+'.since', t.since||'', '—')}` : `due ${ed(bp+'.due', t.due||'', '—')}`;
    return `<div class="task ${t.done?'isdone':''}">${tick(bp+'.done', t.done)}
      <div class="body"><div class="t">${ed(bp+'.title', t.title,'task…')}</div>
      <div class="c">${ed(bp+'.context', t.context,'context…')}</div>
      <div class="meta"><span class="chip"># <span class="edit" contenteditable="true" data-path="${bp+'.tags'}" data-csv="1">${tags}</span></span>
      <span class="chip time">${when}</span></div></div>${del('tasks.'+col,i)}</div>`;
  }).join('') || '<p class="empty">Nothing here.</p>';
  h+= add('tasks.'+col, kind, 'add') + `</div>`;
  return h;
}

// -------- templates for new items --------
function template(kind){
  switch(kind){
    case 'string': return {text:'',done:false};
    case 'q': return '';
    case 'focus': return {title:'',detail:'',done:false};
    case 'watch': return {title:'',detail:'',owner:'',done:false};
    case 'check': return {text:'',done:false};
    case 'deleg': return {person:'',owns:''};
    case 'stage': return {text:''};
    case 'taskActive': case 'taskSomeday': return {title:'',context:'',tags:[],due:null,done:false};
    case 'taskWaiting': return {title:'',context:'',tags:[],since:todayISO(),done:false};
    case 'taskDone': return {title:'',context:'',tags:[],done:true};
    default: return {text:'',done:false};
  }
}

// -------- dirty / save --------
function markDirty(){ dirty=true; $("#savebar").classList.add('show'); $("#saveMsg").textContent='Unsaved changes'; }
function toast(msg, err){ const t=$("#toast"); t.textContent=msg; t.className='toast show'+(err?' err':''); setTimeout(()=>t.className='toast',2600); }

async function save(){
  const btn=$("#saveBtn"); btn.disabled=true; $("#saveMsg").textContent='Saving…';
  DATA.meta.updated = todayISO();
  const payload = { data: DATA, message: 'Update brain via dashboard', password: editPw||undefined };
  try{
    const res = await fetch('/.netlify/functions/save', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
    if(res.status===401){
      const pw = prompt('Enter the edit password:');
      if(pw){ editPw=pw; btn.disabled=false; return save(); }
      btn.disabled=false; $("#saveMsg").textContent='Unsaved changes'; return;
    }
    if(!res.ok){ const j=await res.json().catch(()=>({})); throw new Error(j.error||('HTTP '+res.status)); }
    const j=await res.json();
    dirty=false; $("#savebar").classList.remove('show');
    $("#updated").textContent="Updated "+DATA.meta.updated+(DATA.meta.rule?" · "+DATA.meta.rule:"");
    toast('Saved ✓'+(j.commit?(' · '+j.commit.slice(0,7)):''));
  }catch(e){
    btn.disabled=false; $("#saveMsg").textContent='Unsaved changes';
    if(String(e).includes('Failed to fetch')||String(e).includes('NetworkError'))
      toast('Preview mode — Save works on the live site', true);
    else toast('Save failed: '+e.message, true);
    return;
  }
  btn.disabled=false;
}

// -------- events --------
const app=$("#app");
app.addEventListener('focusout', e=>{
  const el=e.target.closest('[data-path]'); if(!el) return;
  const path=el.getAttribute('data-path');
  let v=el.textContent.trim();
  if(el.dataset.csv){ setP(path, v.split(',').map(s=>s.trim()).filter(Boolean)); }
  else {
    if(v==='' && (path.endsWith('.due')||path.endsWith('.since'))) v=null;
    setP(path, v);
  }
  markDirty();
});
app.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target.hasAttribute && e.target.hasAttribute('contenteditable') && !e.target.dataset.csv){
    e.preventDefault(); e.target.blur();
  }
});
app.addEventListener('click', e=>{
  const t=e.target.closest('[data-tick]');
  if(t){ const p=t.getAttribute('data-tick'); setP(p, !getP(p)); markDirty(); render(); return; }
  const d=e.target.closest('[data-del]');
  if(d){ const ap=d.getAttribute('data-del'); const i=+d.getAttribute('data-idx'); const a=getP(ap); a.splice(i,1); markDirty(); render(); return; }
  const a=e.target.closest('[data-add]');
  if(a){ const ap=a.getAttribute('data-add'); const kind=a.getAttribute('data-kind'); getP(ap).push(template(kind)); markDirty(); render(); return; }
});
$("#saveBtn").addEventListener('click', save);
$("#refreshBtn").addEventListener('click', ()=>{
  if(dirty && !confirm('Discard unsaved changes and reload from the server?')) return;
  load(true);
});
$("#autoToggle").addEventListener('click', ()=>{
  autoOn=!autoOn; $("#autoSwitch").classList.toggle('on',autoOn);
  if(timer){clearInterval(timer);timer=null;}
  if(autoOn) timer=setInterval(()=>{ if(!dirty) load(true); },60000);
});

// -------- load --------
async function load(showSpin){
  const spin=$("#spin"); if(showSpin) spin.classList.add('show');
  try{
    const res=await fetch('/.netlify/functions/brain',{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    DATA=normalize(await res.json());
    $("#infoBanner").classList.remove('show');
    dirty=false; $("#savebar").classList.remove('show');
    render();
  }catch(e){
    DATA=normalize(JSON.parse(JSON.stringify(FALLBACK)));
    const b=$("#infoBanner"); b.textContent="Preview data — not yet connected to the live repo. Editing here is a demo; on the hosted site, Save commits to GitHub."; b.classList.add('show');
    render();
  }finally{ spin.classList.remove('show'); }
}

load(true);
</script>
